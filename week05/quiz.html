<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Fundamentals Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>HTML & CSS Fundamentals Quiz</h1>

        <form action="#" method="post" class="quiz-form">
            <div class="form-item">
                <label for="q1"><span>1.</span> What HTML tag is used to create a hyperlink?</label>
                <input type="text" name="q1" id="q1" placeholder="Enter tag name...">
            </div>

            <div class="form-item">
                <label for="q2"><span>2.</span> Briefly explain the difference between padding and
                    margin in CSS.</label>
                <textarea name="q2" id="q2" rows="4" placeholder="Your answer here..."></textarea>
            </div>

            <div class="form-item">
                <label for="q3"><span>3.</span> Which CSS property is used to change the text color
                    of an element?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="font-color">font-color</option>
                    <option value="color">color</option>
                    <option value="text-color">text-color</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4"><span>4.</span> How many heading levels are available in HTML (from
                    &lt;h1&gt; to &lt;h6&gt;)?</label>
                <input type="number" name="q4" id="q4" min="1" max="10">
            </div>

            <div class="form-item">
                <label for="q5"><span>5.</span> Which attribute is required for an &lt;img&gt; tag
                    to specify the image path?</label>
                <input type="text" name="q5" id="q5" placeholder="e.g. href, src...">
            </div>

            <button type="submit">Submit Quiz</button>

        </form>
    </main>
</body>

</html>
